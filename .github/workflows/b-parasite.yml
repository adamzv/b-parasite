name: Firmware checks
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test
      - name: Check C formatting
        run: |
          python -m pip install clang-format==23.1.3
          git ls-files -z -- 'code/**/*.c' 'code/**/*.h' | xargs -0 clang-format --dry-run --Werror

  firmware:
    needs: host-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: ghcr.io/zephyrproject-rtos/ci:v0.28.8
    env:
      CMAKE_PREFIX_PATH: /opt/toolchains
    steps:
      - uses: actions/checkout@v6
      - name: Build rev 2.0.0 / nRF52840
        run: bash code/scripts/build.sh zigbee nrf52840 2.0.0
      - name: Validate and package
        shell: bash
        run: |
          python3 code/scripts/package_zigbee.py \
            --build-dir code/samples/zigbee/build_nrf52840_2.0.0 \
            --output-dir dist/zigbee-nrf52840-rev2
          cd dist/zigbee-nrf52840-rev2
          sha256sum -c SHA256SUMS
      - name: Make release archives
        shell: bash
        run: |
          tar -czf dist/bparasite-zigbee-nrf52840-rev2.tar.gz -C dist/zigbee-nrf52840-rev2 .
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git archive --format=tar.gz -o dist/source.tar.gz HEAD
          cp CHANGELOG.md dist/CHANGELOG.md
          cd dist
          sha256sum bparasite-zigbee-nrf52840-rev2.tar.gz source.tar.gz CHANGELOG.md > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: zigbee-nrf52840-rev2
          path: |
            dist/bparasite-zigbee-nrf52840-rev2.tar.gz
            dist/source.tar.gz
            dist/CHANGELOG.md
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: zigbee-nrf52840-rev2
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release/CHANGELOG.md
          files: release/*
          fail_on_unmatched_files: true
